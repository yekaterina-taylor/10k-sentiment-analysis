<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10-K Sentiment &amp; Financial Analysis</title>
  <style>
    :root {
      --blue: #004B8D;
      --gold: #FFC423;
      --ink: #1a1a1a;
      --paper: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--blue);
      color: #fff;
      padding: 32px 16px;
      text-align: center;
      border-bottom: 6px solid var(--gold);
    }
    header h1 { margin: 0 0 8px; font-size: 1.9rem; }
    header p { margin: 0; opacity: 0.9; }
    main {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 16px;
      display: grid;
      gap: 16px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      border: 3px solid var(--blue);
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn:hover, .btn:focus-visible { background: var(--gold); color: var(--blue); outline: none; }
    .custom {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .custom input {
      flex: 1 1 200px;
      padding: 18px;
      font-size: 1.1rem;
      border: 3px solid var(--blue);
      border-radius: 8px;
      text-transform: uppercase;
    }
    .custom .btn { flex: 0 1 180px; background: var(--gold); color: var(--blue); }
    .custom .btn:hover, .custom .btn:focus-visible { background: var(--blue); color: #fff; }
    .company {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .logo {
      height: 36px;
      width: 36px;
      object-fit: contain;
      background: #fff;
      border-radius: 6px;
      padding: 4px;
    }
    .label {
      margin: 8px 0 0;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--blue);
    }
    #message {
      min-height: 1.5em;
      text-align: center;
      color: var(--blue);
      font-weight: bold;
    }
    footer {
      background: var(--blue);
      color: #fff;
      text-align: center;
      padding: 14px 16px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>10-K Financial &amp; Sentiment Analysis</h1>
    <p>Ten years of SEC filings, ratios, and Loughran-McDonald MD&amp;A sentiment</p>
  </header>

  <main>
    <form class="custom" id="custom-form">
      <input id="ticker" type="text" placeholder="Any ticker, e.g. WMT" maxlength="10"
             aria-label="Company ticker symbol" autocomplete="off">
      <button class="btn" type="submit">Analyze</button>
    </form>

    <p id="message" role="status"></p>

    <p class="label">Featured analyses</p>

    <!-- To show a logo, add logos/apple.png and logos/nvidia.png to the repo. -->
    <button class="btn company" type="button" data-company="AAPL">
      <img class="logo" src="logos/apple.png" alt="" onerror="this.remove()">
      <span>Apple Inc. (AAPL)</span>
    </button>
    <button class="btn company" type="button" data-company="NVDA">
      <img class="logo" src="logos/nvidia.png" alt="" onerror="this.remove()">
      <span>NVIDIA Corp. (NVDA)</span>
    </button>
  </main>

  <footer>Data source: SEC EDGAR 10-K filings</footer>

  <script>
    // Placeholder behavior only: analysis pages will be added later.
    const message = document.getElementById("message");

    // Companies with a published analysis open their page; others show a notice.
    const published = ["AAPL"];

    document.querySelectorAll("[data-company]").forEach((button) => {
      button.addEventListener("click", () => {
        const t = button.dataset.company;
        if (published.includes(t)) {
          location.href = `company.html?t=${t}`;
        } else {
          message.textContent = `${t} analysis coming soon.`;
        }
      });
    });

    document.getElementById("custom-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const ticker = document.getElementById("ticker").value.trim().toUpperCase();
      message.textContent = ticker
        ? `${ticker} analysis coming soon.`
        : "Please enter a ticker symbol.";
    });
  </script>
</body>
</html>
